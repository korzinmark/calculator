<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Calculator</title>

    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body ontouchstart="">
    <main class="calculator">
        <div class="calculator__screen">
            <div class="calculator__expression" data-expression></div>
            <output class="calculator__display" data-display>0</output>
        </div>

        <div class="calculator__grid" role="group" aria-label="Calculator keypad">
            <button type="button" class="btn btn--function" data-key="delete" aria-label="Delete">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-delete"></use>
                </svg>
            </button>
            <button type="button" class="btn btn--function btn--clear" data-key="clear">AC</button>
            <button type="button" class="btn btn--function" data-key="percent" aria-label="Percent">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-percent"></use>
                </svg>
            </button>
            <button type="button" class="btn btn--operator" data-key="divide" aria-label="Divide" aria-pressed="false">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-divide"></use>
                </svg>
            </button>

            <button type="button" class="btn" data-key="7">7</button>
            <button type="button" class="btn" data-key="8">8</button>
            <button type="button" class="btn" data-key="9">9</button>
            <button type="button" class="btn btn--operator" data-key="multiply" aria-label="Multiply"
                aria-pressed="false">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-multiply"></use>
                </svg>
            </button>

            <button type="button" class="btn" data-key="4">4</button>
            <button type="button" class="btn" data-key="5">5</button>
            <button type="button" class="btn" data-key="6">6</button>
            <button type="button" class="btn btn--operator" data-key="subtract" aria-label="Subtract"
                aria-pressed="false">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-minus"></use>
                </svg>
            </button>

            <button type="button" class="btn" data-key="1">1</button>
            <button type="button" class="btn" data-key="2">2</button>
            <button type="button" class="btn" data-key="3">3</button>
            <button type="button" class="btn btn--operator" data-key="add" aria-label="Add" aria-pressed="false">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-plus"></use>
                </svg>
            </button>

            <button type="button" class="btn" data-key="negate" aria-label="Toggle sign">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-plus-minus"></use>
                </svg>
            </button>
            <button type="button" class="btn" data-key="0">0</button>
            <button type="button" class="btn" data-key="decimal" aria-label="Decimal point">.</button>
            <button type="button" class="btn btn--equals" data-key="equals" aria-label="Equals">
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-equal"></use>
                </svg>
            </button>
        </div>
    </main>

    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="icon-delete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path
                d="M20.6 4.4H10.55Q9.65 4.4 9.02 5.06L2.98 11.34Q2.35 12 2.98 12.66L9.02 18.94Q9.65 19.6 10.55 19.6H20.6Q22.75 19.6 22.75 17.45V6.55Q22.75 4.4 20.6 4.4Z" />
            <path d="m13.4 9.7 4.8 4.8" />
            <path d="m18.2 9.7-4.8 4.8" />
        </symbol>

        <symbol id="icon-percent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.2 4.8 4.8 19.2" />
            <circle cx="7.35" cy="7.35" r="2.55" />
            <circle cx="16.65" cy="16.65" r="2.55" />
        </symbol>

        <symbol id="icon-plus-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.8 7.5h7.4" />
            <path d="M7.5 3.8v7.4" />
            <path d="M19.2 4.8 4.8 19.2" />
            <path d="M12.8 16.5h7.4" />
        </symbol>

        <symbol id="icon-divide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <circle cx="12" cy="6.6" r="1.25" fill="currentColor" stroke="none" />
            <circle cx="12" cy="17.4" r="1.25" fill="currentColor" stroke="none" />
        </symbol>

        <symbol id="icon-multiply" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12" />
            <path d="M18 6L6 18" />
        </symbol>

        <symbol id="icon-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
        </symbol>

        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
        </symbol>

        <symbol id="icon-equal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.6 9.3h12.8" />
            <path d="M5.6 14.7h12.8" />
        </symbol>
    </svg>
</body>

</html>
